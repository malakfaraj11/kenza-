version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kenza_postgres
    restart: always
    environment:
      POSTGRES_USER: kenza
      POSTGRES_PASSWORD: kenzapassword
      POSTGRES_DB: kenzadb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kenza_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
